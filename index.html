<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kettlebell Forge</title>
<meta name="description" content="Kettlebell workout timer with illustrated exercises, spoken cues and a training log.">
<meta name="theme-color" content="#eef0ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151b17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Forge">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
</head>
<body>
<style>
  :root{
    --stage:#dfe3dc;
    --bg:#eef0ea;
    --surface:#ffffff;
    --surface-2:#e2e6dd;
    --ink:#1b211d;
    --ink-dim:#5c665e;
    --line:#d1d6ca;
    --accent:#c1440e;
    --accent-ink:#fff8f3;
    --accent-dim:#c1440e22;
    --good:#3f9142;
    --work:#c1440e;
    --rest:#2f6fd1;
    --shadow: 0 1px 2px rgba(20,25,20,.06), 0 8px 24px rgba(20,25,20,.08);

    --kg-8:#e0568c;  --kg-8-ink:#fff;
    --kg-12:#2f6fd1; --kg-12-ink:#fff;
    --kg-16:#f2c230; --kg-16-ink:#1b211d;
    --kg-20:#8b4fd6; --kg-20-ink:#fff;
    --kg-24:#3f9142; --kg-24-ink:#fff;
    --kg-28:#e8792e; --kg-28-ink:#1b211d;
    --kg-32:#d33a3a; --kg-32-ink:#fff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --stage:#0c100e;
      --bg:#151b17;
      --surface:#1c2420;
      --surface-2:#232c26;
      --ink:#edf1ea;
      --ink-dim:#93a196;
      --line:#2d3730;
      --accent:#ff7a3d;
      --accent-ink:#1b0f08;
      --accent-dim:#ff7a3d26;
      --good:#5cbf60;
      --work:#ff7a3d;
      --rest:#5b9bf2;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    --stage:#0c100e;
    --bg:#151b17;
    --surface:#1c2420;
    --surface-2:#232c26;
    --ink:#edf1ea;
    --ink-dim:#93a196;
    --line:#2d3730;
    --accent:#ff7a3d;
    --accent-ink:#1b0f08;
    --accent-dim:#ff7a3d26;
    --good:#5cbf60;
    --work:#ff7a3d;
    --rest:#5b9bf2;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;}
  body{ background:var(--stage); color:var(--ink); font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif; display:flex; justify-content:center; }
  .app{ width:100%; max-width:480px; min-height:100vh; background:var(--bg); display:flex; flex-direction:column; position:relative; }
  @media (min-width:560px){
    body{ padding-block:28px; }
    .app{ min-height:calc(100vh - 56px); border-radius:22px; box-shadow:var(--shadow); border:1px solid var(--line); overflow:hidden; }
  }

  h1,h2,h3{ font-family:'Big Shoulders Display',ui-sans-serif,sans-serif; text-transform:uppercase; letter-spacing:.02em; margin:0; text-wrap:balance; }
  .mono{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  .eyebrow{ font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-dim); }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }

  /* header */
  header.top{ position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:16px 20px 14px; display:flex; align-items:baseline; justify-content:space-between; }
  .wordmark{ font-family:'Big Shoulders Display'; font-weight:800; font-size:22px; letter-spacing:.03em; display:flex; align-items:center; gap:8px; }
  .wordmark .dot{ width:9px; height:9px; border-radius:2px; background:var(--accent); transform:rotate(45deg); flex:none; }
  .tab-title{ font-size:13px; color:var(--ink-dim); font-weight:600; letter-spacing:.04em; text-transform:uppercase; }

  main#content{ flex:1; padding:18px 20px 28px; display:flex; flex-direction:column; gap:22px; }

  /* bottom nav */
  nav.tabs{ position:sticky; bottom:0; z-index:5; background:var(--bg); border-top:1px solid var(--line); display:flex; }
  nav.tabs button{ flex:1; background:none; border:none; padding:11px 4px 13px; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--ink-dim); font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
  nav.tabs button svg{ width:20px; height:20px; }
  nav.tabs button[aria-current="true"]{ color:var(--accent); }
  nav.tabs button:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }

  /* generic components */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .section-head h2{ font-size:20px; }
  .btn{ border:none; border-radius:10px; padding:11px 16px; font-weight:600; font-size:14px; letter-spacing:.01em; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-ghost{ background:var(--surface-2); color:var(--ink); }
  .btn-outline{ background:transparent; color:var(--ink); border:1px solid var(--line); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 12px; font-size:12.5px; border-radius:8px; }
  .btn[disabled]{ opacity:.4; pointer-events:none; }

  .chip{ display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:99px; font-size:12px; font-weight:600; font-family:'IBM Plex Mono'; }
  .chip-kg{ }
  .chip-format{ background:var(--surface-2); color:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em; font-family:'IBM Plex Sans'; font-size:11px; }
  .chip-cat{ background:var(--surface-2); color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; font-family:'IBM Plex Sans'; font-size:10.5px; }

  .workout-card{ display:flex; flex-direction:column; gap:10px; cursor:pointer; transition:border-color .15s; }
  .workout-card:hover{ border-color:var(--accent); }
  .workout-card .meta{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; color:var(--ink-dim); font-size:12.5px; }
  .workout-card .exlist{ display:flex; flex-wrap:wrap; gap:6px; }
  .workout-card p.desc{ margin:0; color:var(--ink-dim); font-size:13px; line-height:1.5; }

  .row{ display:flex; gap:10px; align-items:center; }
  .between{ justify-content:space-between; }
  .stack{ display:flex; flex-direction:column; gap:14px; }
  .tight{ gap:8px; }

  input[type=text], input[type=number], select, textarea{
    font-family:inherit; font-size:14px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:9px 10px; color:var(--ink); width:100%;
  }
  label.field{ display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:600; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.05em; }

  .kg-picker{ display:flex; gap:6px; flex-wrap:wrap; }
  .kg-opt{ border:2px solid transparent; border-radius:99px; padding:5px 10px; font-family:'IBM Plex Mono'; font-weight:700; font-size:12px; background:var(--surface-2); color:var(--ink); }
  .kg-opt[aria-pressed="true"]{ border-color:var(--ink); }

  .empty{ text-align:center; padding:34px 16px; color:var(--ink-dim); display:flex; flex-direction:column; align-items:center; gap:10px; }
  .empty svg{ width:34px; height:34px; opacity:.5; }

  /* runner */
  .runner{ display:flex; flex-direction:column; gap:18px; align-items:stretch; }
  .runner .phase-tag{ align-self:center; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; padding:5px 14px; border-radius:99px; }
  .phase-work{ background:var(--work); color:var(--accent-ink); }
  .phase-rest{ background:var(--rest); color:#fff; }
  .phase-manual{ background:var(--surface-2); color:var(--ink); }
  .runner h1.exname{ text-align:center; font-size:30px; line-height:1.05; padding:0 6px; }
  .runner .cues{ text-align:center; color:var(--ink-dim); font-size:13.5px; line-height:1.5; padding:0 10px; }
  .timer-ring{ position:relative; width:190px; height:190px; margin:0 auto; }
  .timer-ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .timer-ring circle{ fill:none; stroke-width:9; }
  .timer-num{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono'; font-weight:700; font-size:52px; }
  .runner .progress-dots{ display:flex; gap:5px; justify-content:center; flex-wrap:wrap; padding:0 20px; }
  .progress-dots span{ width:7px; height:7px; border-radius:2px; background:var(--line); }
  .progress-dots span.done{ background:var(--ink-dim); }
  .progress-dots span.now{ background:var(--accent); width:16px; }
  .runner-controls{ display:flex; gap:10px; }
  .runner-controls .btn{ flex:1; }
  .amrap-counter{ display:flex; align-items:center; justify-content:center; gap:18px; padding:10px 0; }
  .amrap-counter .count{ font-family:'IBM Plex Mono'; font-size:64px; font-weight:700; min-width:90px; text-align:center; }
  .round-btn{ width:52px; height:52px; border-radius:99px; border:none; font-size:24px; font-weight:700; background:var(--surface-2); color:var(--ink); }
  .amrap-exlist{ display:flex; flex-direction:column; gap:8px; }
  .amrap-exlist .exrow{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13.5px; padding:8px 10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; }

  /* exercise illustrations */
  .expic{ display:block; width:100%; height:100%; }
  .expic g{ fill:none; stroke:var(--ink); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
  .expic g.ghost{ opacity:.25; }
  .expic .head{ fill:var(--surface); }
  .expic .bell{ fill:var(--accent); stroke:none; }
  .expic .bell-h{ stroke:var(--accent); stroke-width:2.6; }
  .expic .gnd{ stroke:var(--line); stroke-width:2; }
  .expic g .barline{ stroke:var(--ink-dim); stroke-width:3; }
  .chip-bw{ background:var(--surface-2); color:var(--ink); border:1px solid var(--line); font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:11px; }
  .thumb{ width:52px; height:52px; flex:none; border-radius:10px; background:var(--surface-2); padding:3px; }
  .thumb.sm{ width:38px; height:38px; border-radius:8px; padding:2px; }
  .thumb .head{ fill:var(--surface-2); }
  .bigpic{ width:132px; height:132px; margin:0 auto; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:8px; }
  .upnext{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .upnext .main{ flex:1; min-width:0; }
  .upnext .nm{ font-family:'Big Shoulders Display',ui-sans-serif,sans-serif; text-transform:uppercase; font-weight:700; font-size:20px; letter-spacing:.02em; }
  .timer-num.count3{ color:var(--accent); font-size:78px; }
  .timer-num .ready{ font-family:'Big Shoulders Display',ui-sans-serif,sans-serif; font-size:26px; letter-spacing:.06em; }
  .phase-prep{ background:var(--ink); color:var(--bg); }
  .runner-foot{ display:flex; gap:8px; }
  .runner-foot .btn{ flex:1; border-color:transparent; color:var(--ink-dim); }
  .bd-ex-row{ display:flex; flex-direction:column; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px; }
  .bd-ex-top, .bd-ex-bot{ display:flex; align-items:center; gap:6px; }
  .icon-btn[disabled]{ opacity:.35; }
  .backup-card{ display:flex; align-items:center; gap:12px; }
  .backup-card .main{ flex:1; min-width:0; }
  .wk-actions{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
  .wt-chip{ background:var(--surface-2); color:var(--ink); font-family:'IBM Plex Mono',ui-monospace,monospace; }
  .wt-main{ display:flex; align-items:center; gap:10px; }
  .wt-main input{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:22px; font-weight:700; padding:10px 12px; max-width:140px; }
  .wt-main .unit{ font-family:'IBM Plex Mono',ui-monospace,monospace; font-size:16px; font-weight:600; color:var(--ink-dim); }
  .wt-in{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-dim); flex:none; }
  .wt-in input{ width:76px; padding:7px 8px; font-family:'IBM Plex Mono',ui-monospace,monospace; }
  .log-edit{ background:none; border:none; padding:4px 0 0; color:var(--accent); font-weight:600; font-size:12.5px; }

  .log-item{ display:flex; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--line); }
  .log-item:last-child{ border-bottom:none; }
  .log-item .date{ font-size:11px; color:var(--ink-dim); font-weight:600; letter-spacing:.04em; text-transform:uppercase; }
  .log-item .name{ font-weight:600; font-size:14.5px; margin-top:2px; }
  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat-tile{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; }
  .stat-tile .num{ font-family:'IBM Plex Mono'; font-size:22px; font-weight:700; }
  .stat-tile .lbl{ font-size:10.5px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
  .pr-grid{ display:flex; flex-direction:column; gap:8px; }
  .pr-row{ display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 12px; }

  .exercise-row{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .exercise-row .main{ flex:1; min-width:0; }
  .exercise-row .exname-sm{ font-weight:600; font-size:14px; }
  .exercise-row .excat{ font-size:11px; color:var(--ink-dim); }
  .icon-btn{ background:var(--surface-2); border:none; border-radius:8px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:16px; line-height:1; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(10,12,10,.5); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
  @media (min-width:560px){ .modal-backdrop{ align-items:center; } }
  .modal{ background:var(--bg); width:100%; max-width:480px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:20px 20px 26px; display:flex; flex-direction:column; gap:16px; }
  @media (min-width:560px){ .modal{ border-radius:16px; } }
  .modal .mhead{ display:flex; justify-content:space-between; align-items:center; }
  .toast{ position:fixed; left:50%; bottom:86px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:99px; font-size:13px; font-weight:600; z-index:30; box-shadow:var(--shadow); }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="wordmark"><span class="dot"></span>FORGE</div>
    <div class="tab-title" id="tabTitle">Train</div>
  </header>
  <main id="content"></main>
  <nav class="tabs" id="tabs">
    <button data-action="tab" data-tab="train" aria-current="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 12h12M4 9v6M2 10v4M20 9v6M22 10v4"/></svg>
      Train
    </button>
    <button data-action="tab" data-tab="workouts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Workouts
    </button>
    <button data-action="tab" data-tab="log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/></svg>
      Log
    </button>
  </nav>
</div>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- data */

/* Bell load is a level, not a number: everyone's light/medium/heavy is different. */
var LOADS = ["light","medium","heavy"];
var LOAD_LABEL = {light:"Light", medium:"Medium", heavy:"Heavy"};
var LOAD_HINT = {
  light:"Pick a bell you could press overhead 15 or more times.",
  medium:"Pick a bell you could press overhead about 8 to 10 times.",
  heavy:"Pick a bell you could press overhead about 5 times with clean form."
};

var EXERCISES = [
  {id:"two_hand_swing", name:"Two-Hand Swing", cat:"Ballistic", target:"Posterior chain",
    cue:"Hike the bell back like a football snap, then snap the hips forward hard — the arms are a rope, not a pump."},
  {id:"one_hand_swing", name:"One-Hand Swing", cat:"Ballistic", target:"Posterior chain, grip",
    cue:"Same hip snap as the two-hand swing. Keep the free hand loose to help counter the torque."},
  {id:"clean", name:"Clean", cat:"Ballistic", target:"Full body",
    cue:"Pull the bell in close so it rolls softly into the rack — punch through, don't let it crash on the wrist."},
  {id:"snatch", name:"Snatch", cat:"Ballistic", target:"Full body, shoulders",
    cue:"Explode the hips, then punch the hand through at the top so the bell flips over quietly, not up and over the wrist."},
  {id:"high_pull", name:"High Pull", cat:"Ballistic", target:"Upper back, shoulders",
    cue:"Drive the elbow high and back like starting a lawnmower. Hip drive does the lifting, not the arm."},
  {id:"goblet_squat", name:"Goblet Squat", cat:"Grind", target:"Legs, core",
    cue:"Hold the bell by the horns at your chest. Spread the floor with your feet as you sit between your heels."},
  {id:"military_press", name:"Military Press", cat:"Grind", target:"Shoulders",
    cue:"Brace like you're about to be punched in the stomach, then press straight up, tucking your head through at lockout."},
  {id:"turkish_getup", name:"Turkish Get-Up", cat:"Grind", target:"Full body, stability",
    cue:"One slow rep at a time. Eyes on the bell the whole way from floor to standing and back down."},
  {id:"windmill", name:"Windmill", cat:"Grind", target:"Obliques, shoulders",
    cue:"Hinge at the hip, not the waist, sliding the free hand down the straight leg while the bell stays locked overhead."},
  {id:"floor_press", name:"Floor Press", cat:"Grind", target:"Chest, triceps",
    cue:"Elbows kiss the floor gently, then press straight up. The ground stabilizes what your shoulder would otherwise fight."},
  {id:"halo", name:"Halo", cat:"Core & Carry", target:"Shoulders, core",
    cue:"Circle the bell around your head close to the skull, ribs pulled down so the lower back stays quiet."},
  {id:"figure_8", name:"Figure-8", cat:"Core & Carry", target:"Core, grip",
    cue:"Pass the bell hand-to-hand around and between the legs in a smooth figure-8. Stay low in a quarter-squat."},
  {id:"suitcase_carry", name:"Suitcase Carry", cat:"Core & Carry", target:"Core, grip",
    cue:"Walk tall with the bell at your side like a heavy suitcase, resisting the urge to lean away from it."},
  {id:"racked_carry", name:"Racked Carry", cat:"Core & Carry", target:"Core, shoulders",
    cue:"Carry the bell in the rack position at your shoulder, ribs down, exhaling hard with each step."},
  {id:"russian_twist", name:"Russian Twist", cat:"Core & Carry", target:"Obliques",
    cue:"Lean back to a stable angle and rotate from the ribcage, tapping the bell down on each side."},
  {id:"deadlift", name:"Deadlift", cat:"Grind", target:"Hamstrings, glutes, back",
    cue:"Bell between your feet. Push the hips back, flat back, then stand up by driving the floor away."},
  {id:"reverse_lunge", name:"Reverse Lunge", cat:"Grind", target:"Legs, glutes",
    cue:"Hold the bell at your chest and step back until the rear knee nearly kisses the floor. Drive up through the front heel."},
  {id:"bent_over_row", name:"Bent-Over Row", cat:"Grind", target:"Upper back, lats",
    cue:"Hinge to a flat back and row the bell to your hip, elbow brushing your ribs. Pause at the top."},
  {id:"push_press", name:"Push Press", cat:"Ballistic", target:"Shoulders, legs",
    cue:"From the rack, dip a few inches at the knees and drive up hard so the legs launch the bell overhead."},
  {id:"thruster", name:"Thruster", cat:"Ballistic", target:"Full body",
    cue:"Squat with the bell in the rack, then stand up fast and use that momentum to press it overhead in one move."},
  {id:"clean_and_jerk", name:"Clean & Jerk", cat:"Ballistic", target:"Full body",
    cue:"Clean the bell to the rack, then dip, drive with the legs, and drop under it to lock out overhead. Stand tall, then lower back to the rack and the swing."},
  {id:"jerk", name:"Jerk", cat:"Ballistic", target:"Shoulders, legs",
    cue:"From the rack, dip and drive hard, then dip a second time to get under the bell with a locked arm. Stand up to finish."},
  {id:"american_swing", name:"American Swing", cat:"Ballistic", target:"Posterior chain, shoulders",
    cue:"Same hip snap as a regular swing, but let the bell float all the way overhead. Keep the ribs down and stop if your lower back arches."},
  {id:"sumo_high_pull", name:"Sumo High Pull", cat:"Ballistic", target:"Legs, upper back",
    cue:"Wide stance, both hands on the handle. Stand up fast and pull the bell to your chin with elbows high and wide."},
  {id:"single_leg_deadlift", name:"Single-Leg Deadlift", cat:"Grind", target:"Hamstrings, glutes, balance",
    cue:"Bell in the opposite hand. Hinge on one leg while the other reaches straight back, hips square to the floor."},
  {id:"front_squat", name:"Front Squat", cat:"Grind", target:"Legs, core",

function pt(a){ return a[0]+","+a[1]; }
function figSvg(p){
  var k2=p.k2||p.k, f2=p.f2||p.f, s="";
  if(p.bar) s += '<line class="barline" x1="'+p.bar[0]+'" y1="'+p.bar[2]+'" x2="'+p.bar[1]+'" y2="'+p.bar[2]+'"/>';
  s += '<polyline points="'+pt(p.hp)+' '+pt(k2)+' '+pt(f2)+'"/>';
  s += '<polyline points="'+pt(p.hp)+' '+pt(p.k)+' '+pt(p.f)+'"/>';
  s += '<line x1="'+p.n[0]+'" y1="'+p.n[1]+'" x2="'+p.hp[0]+'" y2="'+p.hp[1]+'"/>';
  if(p.e2) s += '<polyline points="'+pt(p.n)+' '+pt(p.e2)+' '+pt(p.w2)+'"/>';
  if(p.e)  s += '<polyline points="'+pt(p.n)+' '+pt(p.e)+' '+pt(p.w)+'"/>';
  s += '<circle class="head" cx="'+p.h[0]+'" cy="'+p.h[1]+'" r="6.5"/>';
  if(p.b){
    var x=p.b[0], y=p.b[1];
    s += '<path class="bell-h" d="M'+(x-3.6)+' '+(y-3)+' Q'+x+' '+(y-10.5)+' '+(x+3.6)+' '+(y-3)+'"/>';
    s += '<circle class="bell" cx="'+x+'" cy="'+y+'" r="5.6"/>';
  }
  return s;
}
function exPic(id){
  var d = PICS[id];
  if(!d) return "";
  return '<svg class="expic" viewBox="0 0 100 100" aria-hidden="true">'+
    '<line class="gnd" x1="8" y1="96" x2="92" y2="96"/>'+
    (d.a ? '<g class="ghost">'+figSvg(d.a)+'</g>' : '')+
    '<g>'+figSvg(d.b)+'</g></svg>';
}
function thumb(id, small){ return '<div class="thumb'+(small?" sm":"")+'">'+exPic(id)+'</div>'; }

/* ---------------------------------------------------------------- utils */

function fmtTime(sec){
  sec = Math.max(0,Math.round(sec));
  var m=Math.floor(sec/60), s=sec%60;
  return m+":"+(s<10?"0":"")+s;
}
function fmtDate(iso){
  var d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:"short", day:"numeric"}) + " · " + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function toLoad(v){
  if(v==="none") return "none";
  if(LOAD_LABEL[v]) return v;
  var n = Number(v);
  if(!n) return "medium";
  return n<=12 ? "light" : n<=20 ? "medium" : "heavy";
}
function kgChipStyle(v){
  if(v==="none") return "";
  var c = {light:"--kg-24", medium:"--kg-16", heavy:"--kg-32"}[toLoad(v)];
  return "background:var("+c+");color:var("+c+"-ink);";
}
function bwChip(){ return '<span class="chip chip-bw">Bodyweight</span>'; }
function isBw(id){ return !!(EX_BY_ID[id] && EX_BY_ID[id].bw); }
function kgChip(v){
  if(v==="none") return bwChip();
  var lv = toLoad(v);
  var bars = LOADS.map(function(x,i){ return '<i style="display:inline-block;width:3px;height:'+(5+i*3)+'px;border-radius:1px;background:currentColor;opacity:'+(i<=LOADS.indexOf(lv)?1:.3)+';"></i>'; }).join("");
  return '<span class="chip chip-kg" style="'+kgChipStyle(lv)+'"><span style="display:inline-flex;align-items:flex-end;gap:1.5px;">'+bars+'</span>'+LOAD_LABEL[lv]+'</span>';
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; });
}
function formatLabel(f){
  return {circuit:"Circuit", emom:"EMOM", tabata:"Tabata", ladder:"Ladder", amrap:"AMRAP"}[f] || f;
}
function estimateDuration(w){
  if(w.format==="circuit"){
    var per = w.exercises.length*(w.workSec+w.restSec);
    return w.rounds*per + (w.rounds-1)*w.roundRestSec;
  }
  if(w.format==="emom") return w.minutes*60;
  if(w.format==="tabata") return 8*30;
  if(w.format==="ladder"){
    var work = w.rungs.reduce(function(a,r){return a+r*8;},0); // rough estimate, 8s/rep
    return work + (w.rungs.length-1)*w.restSec;
  }
  if(w.format==="amrap") return w.capSec;
  return 0;
}
function showToast(msg){
  state.toast = msg;
  render();
  setTimeout(function(){ if(state.toast===msg){ state.toast=null; render(); } }, 2200);
}

/* ---------------------------------------------------------------- audio */

var audioCtx=null;
function ensureAudio(){
  if(!audioCtx){
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(Ctx) audioCtx = new Ctx();
  }
  if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
  return audioCtx;
}
function beep(freq, dur, type, vol, delay){
  var ctx = ensureAudio();
  if(!ctx) return;
  freq=freq||880; dur=dur||0.12; type=type||"sine"; vol=vol==null?0.16:vol; delay=delay||0;
  var t0 = ctx.currentTime+delay;
  var osc = ctx.createOscillator();
  var gain = ctx.createGain();
  osc.type=type; osc.frequency.value=freq;
  gain.gain.setValueAtTime(0.0001,t0);
  gain.gain.linearRampToValueAtTime(vol, t0+0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t0); osc.stop(t0+dur+0.03);
}
function cueTick(){ beep(720,0.07,"square",0.12); }
function cueWorkStart(){ beep(880,0.18,"sawtooth",0.18); }
function cueRestStart(){ beep(420,0.18,"sine",0.16); }
function cueFinish(){ beep(660,0.12,"sine",0.18,0); beep(880,0.12,"sine",0.18,0.14); beep(1180,0.22,"sine",0.2,0.28); }

/* spoken cues */
var LS_VOICE="kbforge_voice_v1";
var voiceOn = (function(){ try{ return localStorage.getItem(LS_VOICE)!=="off"; }catch(e){ return true; } })();
function say(text){
  if(!voiceOn) return;
  try{
    var synth = window.speechSynthesis;
    if(!synth || !window.SpeechSynthesisUtterance) return;
    synth.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 1.05; u.lang = "en-GB";
    synth.speak(u);
  }catch(e){}
}
function toggleVoice(){
  voiceOn = !voiceOn;
  try{ localStorage.setItem(LS_VOICE, voiceOn?"on":"off"); }catch(e){}
  if(!voiceOn){ try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){} }
  renderRunnerOnly();
}
function exName(id){ return EX_BY_ID[id] ? EX_BY_ID[id].name : ""; }
function announce(step, prev){
  var lastKg = function(id){
    var l = state.runner && state.runner.last;
    var v = l && l.byEx[id];
    return v!=null ? ", "+(v%1 ? v.toFixed(1) : v)+" kilos" : "";
  };
  if(step.type==="prep") say("Up next, "+exName(step.ex)+lastKg(step.ex));
  else if(step.type==="rest") say("Rest. Up next, "+exName(step.nextEx)+lastKg(step.nextEx));
  else if(step.type==="work"){ if(prev && (prev.type==="prep"||prev.type==="rest")) say("Go"); }
  else if(step.type==="manual") say("Go. "+String(step.reps).replace("/"," per "));
}

/* ---------------------------------------------------------------- persistence */

function loadLocal(key, fallback){
  try{ var v = JSON.parse(localStorage.getItem(key)); return v||fallback; }catch(e){ return fallback; }
}
function saveLocal(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

function userDoc(){
  return state.db.doc("data/users/"+state.userId+"/profile");
}

function initPersistence(){
  var customLocal = loadLocal(LS_WORKOUTS, []);
  state.workouts = PRESETS.concat(mergeWorkouts([], customLocal));
  state.logs = loadLocal(LS_LOGS, []);
  state.logsLoaded = true;
  render();

  if(!window.claude || !window.claude.use){ return; }
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function(res){
    var db=res[0], user=res[1];
    if(!db || !user) return;
    return user.id().then(function(id){
      if(!id) return;
      state.db = db; state.userId = id; state.persistMode="cloud";
      var doc = userDoc();
      return Promise.all([
        doc.collection("customWorkouts").get(),
        doc.collection("logs").orderBy("date","desc").limit(200).get()
      ]).then(function(r){
        var cw = r[0].docs.map(function(d){ return d.data(); });
        var lg = r[1].docs.map(function(d){ return d.data(); });
        state.workouts = PRESETS.concat(mergeWorkouts(cw, loadLocal(LS_WORKOUTS, [])));
        syncWorkouts();
        state.logs = mergeLogs(lg, loadLocal(LS_LOGS, []));
        render();
        syncPending();
      });
    });
  }).catch(function(){ /* stay on local */ });
}

var LS_WK_PENDING="kbforge_wk_pending_v1";
var LS_WK_DELETED="kbforge_wk_deleted_v1";
function listToggle(key, id, on){
  var p = loadLocal(key, []).filter(function(x){ return x!==id; });
  if(on) p.push(id);
  saveLocal(key, p);
}
function persistCustomWorkout(w){
  var local = loadLocal(LS_WORKOUTS, []).filter(function(x){ return x.id!==w.id; });
  local.push(w); saveLocal(LS_WORKOUTS, local);
  if(state.persistMode==="cloud" && state.db){
    listToggle(LS_WK_PENDING, w.id, true);
    userDoc().collection("customWorkouts").doc(w.id).set(cleanDoc(w))
      .then(function(){ listToggle(LS_WK_PENDING, w.id, false); })
      .catch(function(){ showToast("Saved on this phone."); });
  }
}
function deleteCustomWorkout(id){
  saveLocal(LS_WORKOUTS, loadLocal(LS_WORKOUTS, []).filter(function(w){return w.id!==id;}));
  listToggle(LS_WK_PENDING, id, false);
  if(state.persistMode==="cloud" && state.db){
    listToggle(LS_WK_DELETED, id, true);
    userDoc().collection("customWorkouts").doc(id).delete()
      .then(function(){ listToggle(LS_WK_DELETED, id, false); }).catch(function(){});
  }
}
function mergeWorkouts(cloud, local){
  var gone = loadLocal(LS_WK_DELETED, []), pending = loadLocal(LS_WK_PENDING, []);
  var byId = {};
  cloud.forEach(function(w){ if(w && w.id && gone.indexOf(w.id)===-1) byId[w.id]=w; });
  local.forEach(function(w){
    if(!w || !w.id || gone.indexOf(w.id)!==-1) return;
    if(!byId[w.id] || pending.indexOf(w.id)!==-1) byId[w.id]=w;
  });
  return Object.keys(byId).map(function(k){ return byId[k]; })
    .sort(function(x,y){ return (x.createdAt||0)-(y.createdAt||0); });
}
function syncWorkouts(){
  if(!(state.persistMode==="cloud" && state.db)) return;
  var local = loadLocal(LS_WORKOUTS, []);
  loadLocal(LS_WK_PENDING, []).forEach(function(id){
    var w = local.filter(function(x){ return x.id===id; })[0];
    if(!w){ listToggle(LS_WK_PENDING, id, false); return; }
    userDoc().collection("customWorkouts").doc(id).set(cleanDoc(w)).then(function(){ listToggle(LS_WK_PENDING, id, false); }).catch(function(){});
  });
  loadLocal(LS_WK_DELETED, []).forEach(function(id){
    userDoc().collection("customWorkouts").doc(id).delete().then(function(){ listToggle(LS_WK_DELETED, id, false); }).catch(function(){});
  });
}
/* Store-safe copy: no null/undefined values and no empty objects or arrays. */
function cleanDoc(o){
  var out={};
  Object.keys(o).forEach(function(k){
    var v=o[k];
    if(v===null || v===undefined || (typeof v==="number" && !isFinite(v))) return;
    if(Array.isArray(v)){ if(v.length) out[k]=v.slice(); return; }
    if(typeof v==="object"){ var c=cleanDoc(v); if(Object.keys(c).length) out[k]=c; return; }
    out[k]=v;
  });
  return out;
}
/* Every session is kept on this device first, then copied to the account.
   The device copy is only dropped once the account has confirmed it. */
var LS_PENDING="kbforge_pending_v1";
function keepLocal(entry){
  var arr = loadLocal(LS_LOGS, []);
  var found=false;
  arr = arr.map(function(l){ if(l.id===entry.id){ found=true; return entry; } return l; });
  if(!found) arr.unshift(entry);
  saveLocal(LS_LOGS, arr);
}
function markPending(id, on){
  var p = loadLocal(LS_PENDING, []);
  p = p.filter(function(x){ return x!==id; });
  if(on) p.push(id);
  saveLocal(LS_PENDING, p);
}
function cloudWrite(entry, attempt){
  return userDoc().collection("logs").doc(entry.id).set(cleanDoc(entry)).catch(function(err){
    var code = err && err.code;
    if(!attempt && (code==="unavailable" || code==="resource_exhausted" || !code)){
      return new Promise(function(r){ setTimeout(r, 800+Math.random()*700); }).then(function(){ return cloudWrite(entry, 1); });
    }
    throw err;
  });
}
function persistLog(entry){
  keepLocal(entry);
  if(state.persistMode==="cloud" && state.db){
    markPending(entry.id, true);
    cloudWrite(entry, 0).then(function(){ markPending(entry.id, false); })
      .catch(function(){ showToast("Saved on this phone."); });
  }
}
function updateLog(entry){ persistLog(entry); }
function syncPending(){
  if(!(state.persistMode==="cloud" && state.db)) return;
  var ids = loadLocal(LS_PENDING, []);
  if(!ids.length) return;
  var local = loadLocal(LS_LOGS, []);
  ids.forEach(function(id){
    var e = local.filter(function(l){ return l.id===id; })[0];
    if(!e){ markPending(id,false); return; }
    cloudWrite(e, 0).then(function(){ markPending(id,false); }).catch(function(){});
  });
}
function mergeLogs(cloud, local){
  var byId = {};
  cloud.forEach(function(l){ if(l && l.id) byId[l.id]=l; });
  var pending = loadLocal(LS_PENDING, []);
  local.forEach(function(l){
    if(!l || !l.id) return;
    if(!byId[l.id] || pending.indexOf(l.id)!==-1) byId[l.id]=l;
  });
  return Object.keys(byId).map(function(k){ return byId[k]; })
    .sort(function(x,y){ return String(y.date).localeCompare(String(x.date)); });
}

/* ---------------------------------------------------------------- weights used */

function exIdsOf(w){
  var ids = w.exercises ? w.exercises.map(function(e){return e.ex;}) : (w.exercise?[w.exercise]:[]);
  return ids.filter(function(id,i){ return ids.indexOf(id)===i && EX_BY_ID[id]; });
}
/* The most recent session of this workout that has weights recorded:
   {date, byEx:{exerciseId: kg}}. Matched by workout id, or by name for older sessions. */
function lastSession(w){
  if(!w) return null;
  var best = null;
  state.logs.forEach(function(l){
    var match = (l.workoutId && l.workoutId===w.id) || (!l.workoutId && l.workoutName===w.name);
    if(!match || (l.weightKg==null && !Object.keys(l.exWeights||{}).length)) return;
    if(!best || String(l.date) > String(best.date)) best = l;
  });
  if(!best) return null;
  var byEx = {};
  exIdsOf(w).forEach(function(id){
    if(isBw(id)) return;
    var v = (best.exWeights||{})[id];
    if(v==null) v = best.weightKg;
    if(v!=null) byEx[id] = v;
  });
  return Object.keys(byEx).length ? {date:best.date, log:best, byEx:byEx} : null;
}
function shortDate(iso){ return new Date(iso).toLocaleDateString(undefined,{day:"numeric", month:"short"}); }
function lastChip(id){
  var run = state.runner, last = run && run.last;
  if(!last || last.byEx[id]==null) return "";
  return '<span class="chip wt-chip" title="Weight you used last time">Last: '+esc(fmtKg(last.byEx[id]))+'</span>';
}
function prefillEx(last){
  var out = {};
  if(last) Object.keys(last.log.exWeights||{}).forEach(function(k){ out[k] = String(last.log.exWeights[k]); });
  return out;
}
function lastWeightFor(name){
  for(var i=0;i<state.logs.length;i++){
    var l = state.logs[i];
    if(l.workoutName===name && l.weightKg!=null) return String(l.weightKg);
  }
  return "";
}
function numKg(v){
  var n = parseFloat(String(v==null?"":v).replace(",","."));
  return isFinite(n) && n>0 && n<=200 ? Math.round(n*2)/2 : null;
}
function fmtKg(n){ return (n%1 ? n.toFixed(1) : String(n))+" kg"; }
function readWeightBoxes(target, obj){
  var m = document.getElementById(target+"-weight");
  if(m) obj.weight = m.value;
  Array.prototype.forEach.call(document.querySelectorAll('input[data-action="w-ex"][data-target="'+target+'"]'), function(i){ obj.exWeights[i.dataset.ex] = i.value; });
  var n = document.getElementById(target==="fin" ? "logNotes" : "edit-notes");
  if(n) obj.notes = n.value;
}
function cleanWeights(obj){
  var w = numKg(obj.weight), ex = {};
  Object.keys(obj.exWeights||{}).forEach(function(id){
    var v = numKg(obj.exWeights[id]);
    if(v!=null && v!==w) ex[id]=v;
  });
  return {weightKg:w, exWeights:ex};
}
function weightList(l){
  var vals = [];
  if(l.weightKg!=null) vals.push(l.weightKg);
  Object.keys(l.exWeights||{}).forEach(function(k){ vals.push(l.exWeights[k]); });
  return vals;
}
function weightSummary(l){
  var vals = weightList(l);
  if(!vals.length) return "";
  var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals);
  return lo===hi ? fmtKg(hi) : fmtKg(lo).replace(" kg","")+"–"+fmtKg(hi);
}
function weightForm(target, obj){
  var bellIds = (obj.exIds||[]).filter(function(id){ return !isBw(id); });
  if(obj.exIds && obj.exIds.length && !bellIds.length) return "";

  var ids = bellIds;

    if(open){
      html += '<div class="stack tight">';
      ids.forEach(function(id){
        var v = obj.exWeights[id]!=null ? obj.exWeights[id] : "";
        html += '<div class="exercise-row">'+thumb(id,true)+'<div class="main exname-sm">'+esc(exName(id))+'</div>'+
          '<div class="wt-in"><input type="text" inputmode="decimal" autocomplete="off" id="'+target+'-ex-'+id+'" value="'+esc(v)+'" placeholder="'+esc(obj.weight||"kg")+'" data-action="w-ex" data-ex="'+id+'" data-target="'+target+'" aria-label="'+esc(exName(id))+' weight in kg">kg</div></div>';
      });
      html += '<div style="font-size:12px;color:var(--ink-dim);">Only fill in the ones that were different. Blank means the main weight.</div>';
      html += '</div>';

function openLogEdit(id){
  var l = state.logs.filter(function(x){return x.id===id;})[0];
  if(!l) return;
  var ids = l.exIds;
  if(!ids){
    var w = state.workouts.filter(function(x){return x.name===l.workoutName;})[0];
    ids = w ? exIdsOf(w) : [];
  }
  var exW = {};

  state.editLog = { id:l.id, workoutName:l.workoutName, date:l.date, exIds:ids,
    weight: l.weightKg!=null ? String(l.weightKg) : "", exWeights:exW, perEx:Object.keys(exW).length>0, notes:l.notes||"" };

function saveLogEdit(){
  var e = state.editLog;
  if(!e) return;
  readWeightBoxes("edit", e);
  var l = state.logs.filter(function(x){return x.id===e.id;})[0];

    var cw = cleanWeights(e);

function renderLogEditModal(){

/* ---------------------------------------------------------------- runner: build steps */

function buildSteps(w){
  var steps=[];
  if(w.format==="circuit"){
    for(var r=0;r<w.rounds;r++){
      w.exercises.forEach(function(item, i){
        steps.push({type:"work", ex:item.ex, reps:item.reps, kg:w.kg, durationSec:w.workSec, round:r+1, totalRounds:w.rounds});
        var isLastEx = i===w.exercises.length-1;
        var isLastRound = r===w.rounds-1;
        if(!(isLastEx && isLastRound)){
          steps.push({type:"rest", durationSec: isLastEx? w.roundRestSec : w.restSec, round:r+1, totalRounds:w.rounds,
            label: isLastEx? "Round rest" : "Rest"});
        }
      });
    }
  } else if(w.format==="emom"){
    for(var m=0;m<w.minutes;m++){
      var item = w.exercises[m % w.exercises.length];
      steps.push({type:"work", ex:item.ex, reps:item.reps, kg:w.kg, durationSec:60, round:m+1, totalRounds:w.minutes, minute:true});
    }
  } else if(w.format==="tabata"){
    for(var t=0;t<8;t++){
      steps.push({type:"work", ex:w.exercise, reps:"max quality reps", kg:w.kg, durationSec:20, round:t+1, totalRounds:8});
      if(t<7) steps.push({type:"rest", durationSec:10, round:t+1, totalRounds:8, label:"Rest"});
    }
  } else if(w.format==="ladder"){
    w.rungs.forEach(function(reps, i){
      steps.push({type:"manual", ex:w.exercise, reps:reps+" reps / side", kg:w.kg, round:i+1, totalRounds:w.rungs.length});
      if(i<w.rungs.length-1) steps.push({type:"rest", durationSec:w.restSec, round:i+1, totalRounds:w.rungs.length, label:"Rest before next rung"});
    });
  }
  return addPrep(steps);
}

/* Every exercise is preceded by an "up next" moment that ends in a 3-2-1 countdown.
   Rests already do this in their last seconds; anywhere else gets a short get-ready step. */
var PREP_SEC = 5;
function addPrep(steps){
  var out=[];
  steps.forEach(function(s){
    if(s.type==="rest" && !s.durationSec) return;
    if(s.type==="work" || s.type==="manual"){
      var prev = out[out.length-1];
      if(!prev || prev.type!=="rest" || prev.durationSec<4){
        out.push({type:"prep", durationSec:PREP_SEC, ex:s.ex, reps:s.reps, kg:s.kg, round:s.round, totalRounds:s.totalRounds});
      }
    }
    out.push(s);
  });
  for(var i=0;i<out.length;i++){
    if(out[i].type==="rest"){
      for(var j=i+1;j<out.length;j++){
        if(out[j].ex){ out[i].nextEx=out[j].ex; out[i].nextReps=out[j].reps; out[i].nextKg=out[j].kg; break; }
      }
    }
  }
  return out;
}

/* ---------------------------------------------------------------- runner: control */

function startWorkout(w){
  ensureAudio();
  if(w.format==="amrap"){
    state.runner = {
      workout:w, last:lastSession(w), mode:"amrap", capSec:w.capSec, remaining:w.capSec,
      endAt:null, running:false, count:0, startedAt:Date.now(), tickedWarn:false,
      prepping:true, prepRem:PREP_SEC, prepEnd:Date.now()+PREP_SEC*1000
    };
    say("Up next, "+exName(w.exercises[0].ex));
  } else {
    var steps = buildSteps(w);
    state.runner = {
      workout:w, last:lastSession(w), mode:"steps", steps:steps, idx:0,
      remaining: steps[0].durationSec || 0,
      endAt: steps[0].durationSec ? Date.now()+steps[0].durationSec*1000 : null,
      running: !!steps[0].durationSec, startedAt:Date.now()
    };
    announce(steps[0], null);
  }
  state.tab="train";
  render();
  tickLoop();
}

var tickHandle=null;
function tickLoop(){
  if(tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(function(){
    var run = state.runner;
    if(!run){ clearInterval(tickHandle); return; }
    if(run.mode==="amrap"){
      if(run.prepping){
        var pr = Math.max(0, Math.ceil((run.prepEnd-Date.now())/1000));
        if(pr!==run.prepRem){
          run.prepRem = pr;
          if(pr<=3 && pr>0){ cueTick(); say(String(pr)); }
          if(pr===0) beginAmrapClock();
          renderRunnerOnly();
        }
        return;
      }
      if(!run.running) return;
      var rem = Math.max(0, Math.round((run.endAt-Date.now())/1000));
      if(rem!==run.remaining){
        run.remaining=rem;
        if(rem<=3 && rem>0) cueTick();
        if(rem===0){ run.running=false; cueFinish(); finishRunner(); }
        renderRunnerOnly();
      }
      return;
    }
    // steps mode
    var step = run.steps[run.idx];
    if(step.type==="manual" || !run.running) return;
    var rem2 = Math.max(0, Math.round((run.endAt-Date.now())/1000));
    if(rem2!==run.remaining){
      run.remaining=rem2;
      if(rem2<=3 && rem2>0){
        cueTick();
        if(step.type==="rest" || step.type==="prep") say(String(rem2));
      }
      if(rem2===0){ advanceStep(); }
      renderRunnerOnly();
    }
  }, 200);
}

function currentStep(){
  var run = state.runner;
  if(!run || run.mode!=="steps") return null;
  return run.steps[run.idx];
}

function advanceStep(){
  var run = state.runner;
  var prev = run.steps[run.idx];
  run.idx++;
  if(run.idx>=run.steps.length){
    cueFinish();
    say("Workout complete. Nice work.");
    finishRunner();
    return;
  }
  var step = run.steps[run.idx];
  if(step.type==="work") cueWorkStart(); else if(step.type==="rest") cueRestStart();
  announce(step, prev);
  if(step.durationSec){
    run.remaining = step.durationSec;
    run.endAt = Date.now()+step.durationSec*1000;
    run.running = true;
  } else {
    run.remaining = 0; run.running=false;
  }
  renderRunnerOnly();
}

function skipStep(){
  var run = state.runner;
  if(!run || run.mode!=="steps") return;
  advanceStep();
}
function markManualDone(){
  var run = state.runner;
  if(!run) return;
  advanceStep();
}
function togglePause(){
  var run = state.runner;
  if(!run) return;
  if(run.mode==="amrap"){
    if(run.prepping) return;
    if(run.running){ run.remaining = Math.max(0,Math.round((run.endAt-Date.now())/1000)); run.running=false; }
    else { run.endAt = Date.now()+run.remaining*1000; run.running=true; }
  } else {
    var step = currentStep();
    if(!step || !step.durationSec) return;
    if(run.running){ run.remaining = Math.max(0,Math.round((run.endAt-Date.now())/1000)); run.running=false; }
    else { run.endAt = Date.now()+run.remaining*1000; run.running=true; }
  }
  renderRunnerOnly();
}
function amrapCount(delta){
  var run = state.runner;
  if(!run || run.mode!=="amrap") return;
  run.count = Math.max(0, run.count+delta);
  renderRunnerOnly();
}
function beginAmrapClock(){
  var run = state.runner;
  if(!run || run.mode!=="amrap") return;
  run.prepping=false;
  run.endAt = Date.now()+run.capSec*1000;
  run.remaining = run.capSec;
  run.running = true;
  cueWorkStart(); say("Go");
}
function endRunnerEarly(){
  var run = state.runner;
  if(!run) return;
  if(run.mode==="steps" && run.idx<1 && (Date.now()-run.startedAt)<15000){ quitRunner(); return; }
  if(run.mode==="amrap" && !run.prepping) run.remaining = Math.max(0,Math.round((run.endAt-Date.now())/1000));
  try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
  finishRunner();
}
function finishRunner(){
  var run = state.runner;
  if(!run) return;
  var elapsed = Math.round((Date.now()-run.startedAt)/1000);
  var kg = run.workout.kg;
  var count = run.mode==="amrap" ? run.count : run.workout.rounds || (run.workout.rungs?run.workout.rungs.length:null) || (run.workout.minutes) || null;
  state.lastFinished = {
    workoutId: run.workout.id, workoutName: run.workout.name, format: run.workout.format,
    kg:kg, elapsedSec:elapsed, count:count, countLabel: run.mode==="amrap"?(run.workout.countLabel||"Round"):null,
    exIds: exIdsOf(run.workout), weight: run.last && run.last.log.weightKg!=null ? String(run.last.log.weightKg) : lastWeightFor(run.workout.name),
    exWeights: prefillEx(run.last), perEx: !!(run.last && Object.keys(run.last.log.exWeights||{}).length), notes:""
  };
  state.runner=null;
  if(tickHandle) clearInterval(tickHandle);
  render();
}
function discardFinished(){ state.lastFinished=null; render(); }
function saveFinishedLog(notes){
  var f = state.lastFinished;
  if(!f) return;
  var entry = {
    id: uid(), date: new Date().toISOString(), workoutId:f.workoutId, workoutName:f.workoutName, format:f.format,
    kg:f.kg, elapsedSec:f.elapsedSec, count:f.count, countLabel:f.countLabel, notes: notes||"",
    exIds: f.exIds
  };
  var cw = cleanWeights(f);
  entry.weightKg = cw.weightKg; entry.exWeights = cw.exWeights;
  state.logs.unshift(entry);
  persistLog(entry);
  state.lastFinished=null;
  state.tab="log";
  showToast("Session logged");
}
function quitRunner(){
  if(tickHandle) clearInterval(tickHandle);
  try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
  state.runner=null;
  render();
}

/* ---------------------------------------------------------------- builder */

function openBuilder(src, mode){
  state.confirmWorkout = null;
  state.builderOpen=true;
  if(src){
    var exs = src.exercises ? src.exercises : (src.exercise ? [{ex:src.exercise, reps:""}] : []);
    var isAmrap = src.format==="amrap";
    state.builderDraft = {
      mode: mode, editId: mode==="edit" ? src.id : null, sourceName: src.name,
      createdAt: mode==="edit" ? src.createdAt : null,
      desc: mode==="edit" ? src.desc : "",
      name: mode==="edit" ? src.name : copyName(src.name),
      format: isAmrap ? "amrap" : "circuit",
      kg: src.kg || "medium",
      rounds: src.rounds || (src.rungs ? src.rungs.length : 3),
      workSec: src.workSec || (src.format==="tabata" ? 20 : src.format==="emom" ? 45 : 30),
      restSec: src.restSec!=null ? src.restSec : (src.format==="tabata" ? 10 : 15),
      roundRestSec: src.roundRestSec!=null ? src.roundRestSec : 60,
      capSec: src.capSec || (src.minutes ? src.minutes*60 : 600),
      countLabel: src.countLabel || "Round",
      exercises: exs.map(function(e){ return {ex:e.ex, reps:e.reps||""}; })
    };
  } else {
    state.builderDraft = {
      mode:"new", name:"", format:"circuit", kg:"medium",
      rounds:3, workSec:30, restSec:15, roundRestSec:60,
      capSec:600, countLabel:"Round",
      exercises:[{ex:"two_hand_swing", reps:""}]
    };
  }
  render();
}
function copyName(name){
  var base = String(name).replace(/ \(variant( \d+)?\)$/,"");
  var taken = state.workouts.map(function(w){ return w.name; });
  var n = base+" (variant)", i = 2;
  while(taken.indexOf(n)!==-1){ n = base+" (variant "+i+")"; i++; }
  return n;
}
function closeBuilder(){ state.builderOpen=false; state.builderDraft=null; render(); }
function builderAddExercise(){
  state.builderDraft.exercises.push({ex:EXERCISES[0].id, reps:""});
  render();
}
function builderRemoveExercise(i){
  state.builderDraft.exercises.splice(i,1);
  render();
}
function builderMoveExercise(i, dir){
  var ex = state.builderDraft.exercises, j = i+dir;
  if(j<0 || j>=ex.length) return;
  var t = ex[i]; ex[i]=ex[j]; ex[j]=t;
  render();
}
function saveBuilder(){
  var d = state.builderDraft;
  if(!d.name.trim()){ showToast("Give it a name"); return; }
  if(d.exercises.length===0){ showToast("Add at least one exercise"); return; }
  var desc = d.desc || (d.mode==="copy" ? "Variant of "+d.sourceName+"." : "Custom "+formatLabel(d.format).toLowerCase()+" workout.");
  var w = { id: d.editId || ("c_"+uid()), custom:true, name:d.name.trim(), format:d.format, kg:d.kg,
    desc: desc, createdAt: d.createdAt || Date.now(), updatedAt: Date.now() };
  w.exercises = d.exercises.map(function(e){return {ex:e.ex, reps:e.reps||"go by feel"};});
  if(d.format==="circuit"){
    w.rounds=d.rounds; w.workSec=d.workSec; w.restSec=d.restSec; w.roundRestSec=d.roundRestSec;
  } else {
    w.capSec=d.capSec; w.countLabel=d.countLabel;
  }
  if(d.editId){
    state.workouts = state.workouts.map(function(x){ return x.id===d.editId ? w : x; });
  } else {
    state.workouts.push(w);
  }
  persistCustomWorkout(w);
  state.builderOpen=false; state.builderDraft=null;
  state.tab="workouts";
  showToast(d.editId ? "Workout updated" : d.mode==="copy" ? "Copy saved to your workouts" : "Workout saved");
}
function findWorkout(id){ return state.workouts.filter(function(x){return x.id===id;})[0]; }

/* ---------------------------------------------------------------- render: shell */

var content = document.getElementById("content");
var tabTitleEl = document.getElementById("tabTitle");
var tabsEl = document.getElementById("tabs");

function render(){
  tabTitleEl.textContent = state.runner ? "In Session" : ({train:"Train", workouts:"Workouts", log:"Log"}[state.tab]);
  Array.prototype.forEach.call(tabsEl.querySelectorAll("button"), function(b){
    b.setAttribute("aria-current", b.dataset.tab===state.tab ? "true":"false");
  });

  var html = "";
  if(state.tab==="train") html = renderTrain();
  else if(state.tab==="workouts") html = renderWorkouts();
  else if(state.tab==="log") html = renderLog();

  if(state.builderOpen) html += renderBuilder();
  if(state.editLog) html += renderLogEditModal();
  if(state.backupOpen) html += renderBackupModal();
  if(state.toast) html += '<div class="toast">'+esc(state.toast)+'</div>';

  content.innerHTML = html;
}

function renderRunnerOnly(){
  if(state.tab!=="train") return;
  content.innerHTML = renderTrain();
}

/* ---------------------------------------------------------------- render: train tab */

function renderTrain(){
  if(state.lastFinished){ return renderFinishScreen(); }
  if(state.runner){ return renderRunner(); }

  var recent = state.workouts.slice(0,3);
  var html = '<div class="stack">';
  html += '<div class="card" style="text-align:center;">';
  html += '<div class="eyebrow" style="margin-bottom:6px;">Ready when you are</div>';
  html += '<h2 style="font-size:24px;margin-bottom:8px;">Pick up the bell</h2>';
  html += '<p style="color:var(--ink-dim);font-size:13.5px;line-height:1.5;margin:0 0 14px;">Choose a workout from your library and Forge will run the clock, the rounds, and the rest.</p>';
  html += '<button class="btn btn-primary btn-block" data-action="tab" data-tab="workouts">Browse workouts</button>';
  html += '</div>';

  html += '<div class="section-head"><h2>Quick start</h2></div>';
  html += '<div class="stack tight">';
  recent.forEach(function(w){ html += workoutCard(w); });
  html += '</div>';
  html += '</div>';
  return html;
}

function ringSvg(pct, colorVar){
  var r=98, c=2*Math.PI*r;
  var off = c*(1-pct);
  return '<div class="timer-ring"><svg viewBox="0 0 220 220">'+
    '<circle cx="110" cy="110" r="'+r+'" stroke="var(--line)"></circle>'+
    '<circle cx="110" cy="110" r="'+r+'" stroke="'+colorVar+'" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" stroke-linecap="round"></circle>'+
    '</svg></div>';
}

function countdownNum(rem, pct, color){
  var inner = rem<=3 && rem>0
    ? '<div class="timer-num count3 mono">'+rem+'</div>'
    : '<div class="timer-num"><span class="ready">GET READY</span></div>';
  return '<div style="position:relative;">'+ringSvg(pct,color)+inner+'</div>';
}
function upNextCard(id, reps, kg){
  if(!id) return "";
  return '<div class="upnext">'+thumb(id)+'<div class="main"><div class="eyebrow">Up next</div><div class="nm">'+esc(exName(id))+'</div>'+
    '<div style="font-size:12.5px;color:var(--ink-dim);">'+esc(reps||"")+'</div></div>'+
    '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">'+(isBw(id)?bwChip():(kg?kgChip(kg):""))+lastChip(id)+'</div></div>';
}
function runnerFoot(endLabel, act){
  return '<div class="runner-foot">'+
    '<button class="btn btn-outline" data-action="toggle-voice" aria-pressed="'+voiceOn+'">Voice: '+(voiceOn?"On":"Off")+'</button>'+
    '<button class="btn btn-outline" data-action="'+(act||"quit")+'">'+endLabel+'</button></div>';
}

function renderRunner(){
  var run = state.runner;
  var w = run.workout;
  var html = '<div class="runner">';

  if(run.mode==="amrap" && run.prepping){
    var first = w.exercises[0];
    html += '<div class="phase-tag phase-prep">Get ready</div>';

    html += '<h1 class="exname">'+esc(exName(first.ex))+'</h1>';
    html += '<div class="row" style="justify-content:center;gap:8px;flex-wrap:wrap;">'+kgChip(w.kg)+'<span class="chip chip-format">'+fmtTime(w.capSec)+' AMRAP</span>'+lastChip(first.ex)+'</div>';
    html += countdownNum(run.prepRem, run.prepRem/PREP_SEC, "var(--accent)");
    html += '<button class="btn btn-ghost btn-block" data-action="skip-prep">Start now</button>';
    html += runnerFoot("Quit", "quit");
  } else if(run.mode==="amrap"){
    var pct = run.capSec? (run.remaining/run.capSec) : 0;
    html += '<div class="phase-tag phase-work">'+esc(w.name)+'</div>';
    html += '<div style="position:relative;">'+ringSvg(pct,"var(--work)")+

    html += '<div class="amrap-counter">';
    html += '<button class="round-btn" data-action="amrap-dec" aria-label="Remove one">&minus;</button>';
    html += '<div><div class="count mono">'+run.count+'</div><div class="eyebrow" style="text-align:center;">'+esc(w.countLabel||"Round")+'s</div></div>';
    html += '<button class="round-btn" data-action="amrap-inc" aria-label="Add one">+</button>';
    html += '</div>';
    html += '<div class="amrap-exlist">';
    w.exercises.forEach(function(item){
      var ex = EX_BY_ID[item.ex];
      html += '<div class="exrow">'+thumb(item.ex,true)+'<span style="flex:1;min-width:0;">'+esc(ex.name)+' <span style="color:var(--ink-dim);">— '+esc(item.reps)+'</span></span>'+(isBw(item.ex)?bwChip():(lastChip(item.ex)||kgChip(w.kg)))+'</div>';
    });
    html += '</div>';
    html += '<div class="runner-controls">';
    html += '<button class="btn btn-ghost" data-action="pause">'+(run.running?"Pause":"Resume")+'</button>';
    html += '<button class="btn btn-outline" data-action="end-early">End &amp; log</button>';
    html += '</div>';
    html += runnerFoot("Quit without logging", "quit");
  } else {
    var step = run.steps[run.idx];
    var ex = step.ex ? EX_BY_ID[step.ex] : null;
    var tagClass = step.type==="work"?"phase-work":step.type==="rest"?"phase-rest":step.type==="prep"?"phase-prep":"phase-manual";
    var tagText = step.type==="work" ? (w.format==="emom" ? "Minute "+step.round+" / "+step.totalRounds : "Round "+step.round+" / "+step.totalRounds)
                : step.type==="rest" ? (step.label||"Rest")
                : step.type==="prep" ? "Get ready"
                : "Rung "+step.round+" / "+step.totalRounds;
    html += '<div class="phase-tag '+tagClass+'">'+esc(tagText)+'</div>';

    if(step.type==="prep"){
      html += '<div class="bigpic">'+exPic(step.ex)+'</div>';

      html += '<h1 class="exname">'+esc(ex.name)+'</h1>';
      html += '<div class="row" style="justify-content:center;gap:8px;">'+(isBw(step.ex)?bwChip():kgChip(step.kg))+'<span class="chip chip-format">'+esc(step.reps)+'</span>'+lastChip(step.ex)+'</div>';
      html += countdownNum(run.remaining, run.remaining/step.durationSec, "var(--accent)");
    } else if(step.type==="rest"){
      var pct2 = step.durationSec? (run.remaining/step.durationSec):0;

      html += '<div style="position:relative;">'+ringSvg(pct2,"var(--rest)")+restNum+'</div>';

    });
    html += '</div>';

      html += '<button class="btn btn-primary" data-action="manual-done" style="flex:2;">Mark rung done</button>';

      html += '<button class="btn btn-ghost" data-action="pause">'+(run.running?"Pause":"Resume")+'</button>';
      html += '<button class="btn btn-outline" data-action="skip">'+(step.type==="prep"?"Start now":"Skip")+'</button>';

  html += '</div>';

/* ---------------------------------------------------------------- render: workouts tab */

function workoutCard(w){

/* ---------------------------------------------------------------- backup / restore */

function backupText(){
  return JSON.stringify({
    app:"kettlebell-forge", version:1, exportedAt:new Date().toISOString(),
    workouts: state.workouts.filter(function(w){ return w.custom; }),
    logs: state.logs
  });
}
function restoreBackup(text){
  var data;
  try{ data = JSON.parse(String(text||"").trim()); }catch(e){ return "That doesn't look like a Forge backup. Copy the whole text and try again."; }
  if(!data || data.app!=="kettlebell-forge" || !Array.isArray(data.logs)){ return "That doesn't look like a Forge backup. Copy the whole text and try again."; }
  var addedLogs=0, addedWk=0;
  var haveLogs = {}; state.logs.forEach(function(l){ haveLogs[l.id]=l; });
  data.logs.forEach(function(l){
    if(!l || !l.id || !l.date || !l.workoutName) return;
    var mine = haveLogs[l.id];
    if(mine && JSON.stringify(mine)===JSON.stringify(l)) return;
    if(!mine) addedLogs++;
    state.logs = state.logs.filter(function(x){ return x.id!==l.id; }).concat([l]);
    persistLog(l);
  });
  state.logs.sort(function(x,y){ return String(y.date).localeCompare(String(x.date)); });
  (data.workouts||[]).forEach(function(w){
    if(!w || !w.id || !w.name || !Array.isArray(w.exercises)) return;
    w.custom = true;
    var mine = findWorkout(w.id);
    if(mine && (mine.updatedAt||0) >= (w.updatedAt||0)) return;
    if(!mine) addedWk++;
    state.workouts = state.workouts.filter(function(x){ return x.id!==w.id; }).concat([w]);
    persistCustomWorkout(w);
  });
  state.backupOpen=false;
  showToast("Restored "+addedLogs+" session"+(addedLogs===1?"":"s")+" and "+addedWk+" workout"+(addedWk===1?"":"s"));
  return null;
}
function renderBackupModal(){
  var html = '<div class="modal-backdrop"><div class="modal">';
  html += '<div class="mhead"><h2 style="font-size:20px;">Backup</h2><button class="icon-btn" data-action="backup-close" aria-label="Close">&times;</button></div>';
  html += '<label class="field" for="backup-out">Your data</label>';
  html += '<div style="font-size:12.5px;color:var(--ink-dim);margin-top:-10px;">'+state.logs.length+' session'+(state.logs.length===1?'':'s')+' and '+state.workouts.filter(function(w){return w.custom;}).length+' of your own workouts. Copy this, then paste it into the other copy of Forge.</div>';
  html += '<textarea id="backup-out" rows="3" readonly style="font-family:\'IBM Plex Mono\',ui-monospace,monospace;font-size:11px;">'+esc(backupText())+'</textarea>';
  html += '<button class="btn btn-primary btn-block" data-action="backup-copy">Copy backup</button>';
  html += '<label class="field" for="backup-in" style="margin-top:8px;">Restore</label>';
  html += '<div style="font-size:12.5px;color:var(--ink-dim);margin-top:-10px;">Paste a backup here. It adds to what\'s already in this app and never deletes anything.</div>';
  html += '<textarea id="backup-in" rows="3" placeholder="Paste backup text"></textarea>';
  if(state.backupError) html += '<div style="font-size:12.5px;color:var(--accent);">'+esc(state.backupError)+'</div>';

  return html;
}

/* ---------------------------------------------------------------- events */

document.getElementById("app").addEventListener("click", function(e){
  if(e.target.classList && e.target.classList.contains("modal-backdrop")){
    if(state.backupOpen){ state.backupOpen=false; state.backupError=null; render(); } else if(state.editLog){ state.editLog=null; render(); } else if(state.builderOpen) { /* keep edits: close with the X */ } else if(state.confirmWorkout) { state.confirmWorkout=null; render(); }
    return;
  }
  var t = e.target.closest("[data-action]");
  if(!t) return;
  var action = t.dataset.action;

  if(action==="tab"){ state.tab=t.dataset.tab; state.confirmWorkout=null; render(); return; }
  if(action==="open-workout"){ openWorkoutConfirm(t.dataset.id); return; }
  if(action==="close-confirm"){ state.confirmWorkout=null; render(); return; }
  if(action==="start-workout"){
    var w = state.workouts.filter(function(x){return x.id===t.dataset.id;})[0];
    state.confirmWorkout=null;
    if(w) startWorkout(w);
    return;
  }
  if(action==="edit-workout"){ var we=findWorkout(t.dataset.id); state.pendingDelete=null; if(we) openBuilder(we,"edit"); return; }
  if(action==="copy-workout"){ var wc=findWorkout(t.dataset.id); if(wc) openBuilder(wc,"copy"); return; }
  if(action==="bd-move"){ builderMoveExercise(parseInt(t.dataset.idx,10), parseInt(t.dataset.dir,10)); return; }
  if(action==="bd-delete"){
    var did = state.builderDraft && state.builderDraft.editId;
    if(!did) return;
    if(state.pendingDelete!==did){ state.pendingDelete=did; render(); return; }
    state.pendingDelete=null;
    state.workouts = state.workouts.filter(function(w){return w.id!==did;});
    deleteCustomWorkout(did);
    state.builderOpen=false; state.builderDraft=null;
    showToast("Workout deleted");
    return;
  }
  if(action==="delete-workout"){
    e.stopPropagation();
    state.workouts = state.workouts.filter(function(w){return w.id!==t.dataset.id;});
    deleteCustomWorkout(t.dataset.id);
    render();
    return;
  }
  if(action==="open-builder"){ openBuilder(null,"new"); return; }
  if(action==="close-builder"){ closeBuilder(); return; }
  if(action==="bd-format"){ state.builderDraft.format=t.dataset.val; render(); return; }
  if(action==="bd-kg"){ state.builderDraft.kg=t.dataset.val; render(); return; }
  if(action==="bd-add-ex"){ builderAddExercise(); return; }
  if(action==="bd-remove-ex"){ builderRemoveExercise(parseInt(t.dataset.idx,10)); return; }
  if(action==="bd-save"){ saveBuilder(); return; }

  if(action==="pause"){ togglePause(); return; }
  if(action==="skip"){ skipStep(); return; }
  if(action==="manual-done"){ markManualDone(); return; }
  if(action==="quit"){ quitRunner(); return; }
  if(action==="amrap-inc"){ amrapCount(1); return; }
  if(action==="amrap-dec"){ amrapCount(-1); return; }
  if(action==="end-early"){ endRunnerEarly(); return; }
  if(action==="toggle-voice"){ toggleVoice(); return; }
  if(action==="skip-prep"){ beginAmrapClock(); renderRunnerOnly(); return; }
  if(action==="save-log"){
    if(state.lastFinished) readWeightBoxes("fin", state.lastFinished);
    var notes = document.getElementById("logNotes");
    saveFinishedLog(notes?notes.value:"");
    render();
    return;
  }
  if(action==="discard-log"){ discardFinished(); return; }
  if(action==="w-toggle"){
    var wo = t.dataset.target==="edit" ? state.editLog : state.lastFinished;
    if(wo){ wo.perEx = !wo.perEx; render(); }
    return;
  }
  if(action==="backup-open"){ state.backupOpen=true; state.backupError=null; render(); return; }
  if(action==="backup-close"){ state.backupOpen=false; state.backupError=null; render(); return; }
  if(action==="backup-copy"){
    var out = document.getElementById("backup-out");
    var txt = backupText();
    var fallback = function(){ if(out){ out.focus(); out.select(); out.setSelectionRange(0, out.value.length); } };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){ showToast("Backup copied"); }, fallback);
      } else fallback();
    }catch(err){ fallback(); }
    return;
  }
  if(action==="backup-restore"){
    var inp = document.getElementById("backup-in");
    var err = restoreBackup(inp ? inp.value : "");
    if(err){ state.backupError = err; render(); }
    return;
  }
  if(action==="edit-log"){ openLogEdit(t.dataset.id); return; }
  if(action==="edit-cancel"){ state.editLog=null; render(); return; }
  if(action==="edit-save"){ saveLogEdit(); return; }
});

document.getElementById("app").addEventListener("input", function(e){
  var t = e.target;
  var action = t.dataset.action;
  if(!action) return;
  if(action==="w-main" || action==="w-ex" || action==="w-notes"){
    var tg = t.dataset.target, obj = tg==="edit" ? state.editLog : state.lastFinished;
    if(!obj) return;
    if(action==="w-main"){
      obj.weight = t.value;
      Array.prototype.forEach.call(document.querySelectorAll('input[data-action="w-ex"][data-target="'+tg+'"]'), function(i){ i.placeholder = t.value || "kg"; });
    } else if(action==="w-ex") obj.exWeights[t.dataset.ex] = t.value;
    else obj.notes = t.value;
    return;
  }
  var d = state.builderDraft;
  if(!d) return;
  if(action==="bd-name") d.name=t.value;
  else if(action==="bd-rounds") d.rounds=Math.max(1,parseInt(t.value,10)||1);
  else if(action==="bd-work") d.workSec=Math.max(5,parseInt(t.value,10)||30);
  else if(action==="bd-rest") d.restSec=Math.max(0,parseInt(t.value,10)||0);
  else if(action==="bd-roundrest") d.roundRestSec=Math.max(0,parseInt(t.value,10)||0);
  else if(action==="bd-cap") d.capSec=Math.max(60,(parseInt(t.value,10)||10)*60);
  else if(action==="bd-countlabel") d.countLabel=t.value||"Round";
  else if(action==="bd-ex") d.exercises[parseInt(t.dataset.idx,10)].ex=t.value;
  else if(action==="bd-reps") d.exercises[parseInt(t.dataset.idx,10)].reps=t.value;
});

/* confirm modal is layered on top of whatever tab is active */
var _render = render;
render = function(){
  _render();
  if(state.confirmWorkout){
    content.innerHTML += renderWorkoutDetailModal(state.confirmWorkout);
  }
};

/* ---------------------------------------------------------------- boot */

function start(saved){
  if(saved && saved.tab) state.tab = saved.tab;
  if(saved && saved.lastFinished) state.lastFinished = saved.lastFinished;
  if(saved && saved.runner){ state.runner = saved.runner; tickLoop(); }
  render();
  initPersistence();
}
if(window.claude && window.claude.hot){
  window.claude.hot.snapshot(function(){
    if(state.lastFinished){ readWeightBoxes("fin", state.lastFinished); }
    return {tab: state.tab, runner: state.runner, lastFinished: state.lastFinished};
  });
  window.claude.hot.ready ? window.claude.hot.ready(start) : start(window.claude.hot.data||{});
} else {
  start({});
}

})();
</script>
